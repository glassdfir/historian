.logo b{font-size:17px;letter-spacing:.2px}
.logo .sub{color:var(--muted);font-size:12px;margin-left:2px}
.spacer{flex:1}
.local{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.local i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 0 3px rgba(92,201,138,.15)}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}

aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;padding:10px 0 30px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);padding:12px 16px 6px}

.srchead{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 16px}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--bad);background:var(--panel2)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.b-chromium{color:#7fb4ff;border-color:#2c4566}
.b-firefox{color:#ff9d5c;border-color:#5e3a22}
.b-safari{color:#62d0e6;border-color:#22505a}

.it{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 26px;cursor:pointer;color:var(--text);border-left:2px solid transparent}

details>summary .car{display:inline-block;transition:transform .15s;color:var(--dim);width:10px}
details[open]>summary .car{transform:rotate(90deg)}
main{min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.count{font:12px var(--mono);color:var(--muted)}

.body{flex:1;display:flex;min-height:0}

#grid tbody tr.r{cursor:default}
#grid tbody tr.r:hover td{background:var(--hover)}
#grid tbody tr.r.on td{background:var(--sel)}
.ty-t{font-family:var(--mono);font-size:12px;color:#f0c27a}
.ty-u{color:var(--blue)}
.ty-n{font-family:var(--mono);font-size:12px;text-align:right}
.ty-tr,.ty-fv{font-family:var(--mono);font-size:11.5px;color:var(--teal)}
.ty-b{font-size:12px;color:var(--muted)}
td.null{color:var(--dim)}
#detail{width:400px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px 40px;flex:none}
#detail h3{margin:0 0 12px;font-size:13px;display:flex;align-items:center;gap:8px}
#detail h3 span{flex:1}
.kv{padding:8px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:3px}
.kv .v{word-break:break-all;white-space:pre-wrap}
.kv .v.ty-n{text-align:left}
.kv .muted{color:var(--muted);font-size:12px}

.console{border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.console textarea{flex:1;min-width:300px;height:96px;resize:vertical;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font:12.5px/1.5 var(--mono);outline:none}
.console textarea:focus{border-color:var(--accent)}
.console .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.console .err{color:var(--bad);font:12px var(--mono);flex-basis:100%;white-space:pre-wrap}
.console .hint{color:var(--dim);font-size:11.5px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}
.presets{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.empty{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto}
.drop{max-width:760px;width:100%;border:1.5px dashed var(--line2);border-radius:14px;padding:38px 40px;background:linear-gradient(180deg,rgba(233,162,59,.035),transparent)}
.drop h1{margin:0 0 6px;font-size:24px}
.drop p{color:var(--muted);margin:0 0 18px;max-width:600px}
.drop .acts{display:flex;gap:10px;margin-bottom:26px}
.sup{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sup div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.sup b{display:block;margin-bottom:6px}
.sup code{font:11.5px var(--mono);color:var(--muted);display:block;line-height:1.7}
.tips{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.7}
.tips code{font-family:var(--mono);color:var(--text);background:var(--panel2);padding:1px 5px;border-radius:4px}
#dropov{position:fixed;inset:0;background:rgba(13,16,21,.82);display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none}
#dropov div{border:2px dashed var(--accent);border-radius:16px;padding:40px 60px;font-size:18px;color:var(--accent)}
body.dragging #dropov{display:flex}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{border-color:var(--bad)}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,16,21,.6);z-index:55;font-size:14px;color:var(--muted)}
#loading.show{display:flex}
.nodata{padding:40px;color:var(--muted);text-align:center}
@media (max-width:900px){#app{grid-template-columns:1fr}aside{display:none}.sup{grid-template-columns:1fr}#detail{position:fixed;right:0;top:54px;bottom:0;z-index:20;width:min(400px,92vw)}}

<script>
"use strict";
/* ============================================================
   Schema — client-side SQLite parser for browser artifacts
   SQLite engine: sql.js (MIT) — https://github.com/sql-js/sql.js
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- engine boot: WASM first, pure-JS fallback ---------- */
let SQL = null, ENGINE = '';
const sqlReady = (async () => {
  try {
    SQL = await Promise.race([initSqlJs(), new Promise((_, rej) => setTimeout(() => rej(new Error('WASM init timeout')), 10000))]); ENGINE = 'WASM';
  } catch (e) {
    console.warn('WASM engine unavailable, falling back to asm.js', e);
    SQL = await window.__initSqlJsAsm(); ENGINE = 'asm.js';
  }
  return SQL;
})();

/* ---------- state ---------- */
const S = { files: [], combined: [], reports: new Map(), view: null, tz: 'utc', seq: 0 };

/* ---------- time ---------- */
const pad = (n, w = 2) => String(n).padStart(w, '0');
function fmtT(ms, tz = S.tz) {
  if (ms == null || ms === '') return '';
  const d = new Date(ms);
  if (isNaN(d.getTime())) return String(ms);
  const u = tz === 'utc';
  const Y = u ? d.getUTCFullYear() : d.getFullYear(), M = u ? d.getUTCMonth() : d.getMonth(), D = u ? d.getUTCDate() : d.getDate();
  const h = u ? d.getUTCHours() : d.getHours(), m = u ? d.getUTCMinutes() : d.getMinutes(), s = u ? d.getUTCSeconds() : d.getSeconds();
  const ml = u ? d.getUTCMilliseconds() : d.getMilliseconds();
  return `${Y}-${pad(M + 1)}-${pad(D)} ${pad(h)}:${pad(m)}:${pad(s)}.${pad(ml, 3)}`;
}
// Timestamp formats seen in browser artifacts. Ranges cover roughly 1997–2060.
const TSF = [
  { name: 'WebKit µs',   min: 1.25e16, max: 1.45e16, to: v => v / 1000 - 11644473600000 },
  { name: 'FILETIME',    min: 1.25e17, max: 1.45e17, to: v => v / 1e4 - 11644473600000 },
  { name: 'Unix µs',     min: 8.5e14,  max: 2.9e15,  to: v => v / 1000 },
  { name: 'Unix ms',     min: 8.5e11,  max: 2.9e12,  to: v => v },
  { name: 'Unix s',      min: 8.5e8,   max: 2.9e9,   to: v => v * 1000 },
  { name: 'Mac abs s',   min: 1.0e8,   max: 8.5e8,   to: v => (v + 978307200) * 1000 },
];
const guessFmt = v => (typeof v === 'number' && v) ? (TSF.find(f => v >= f.min && v <= f.max) || null) : null;

/* SQL helpers that convert timestamps to Unix ms inside SQLite (exact integer maths) */
const WK  = x => `CASE WHEN ${x} > 0 THEN (${x} / 1000 - 11644473600000) END`;        // Chromium: µs since 1601
const PR  = x => `CASE WHEN ${x} > 0 THEN (${x} / 1000) END`;                         // Firefox PRTime: µs since 1970
const MAC = x => `CASE WHEN ${x} IS NOT NULL AND ${x} <> 0 THEN CAST(ROUND((${x} + 978307200) * 1000) AS INTEGER) END`; // Safari/Cocoa: s since 2001
const US  = x => `CASE WHEN ${x} > 0 THEN (${x} * 1000) END`;                         // Unix seconds
const sel = parts => parts.filter(Boolean).join(',\n  ');

/* ---------- decoders ---------- */
const CHROME_CORE = ['LINK','TYPED','AUTO_BOOKMARK','AUTO_SUBFRAME','MANUAL_SUBFRAME','GENERATED','AUTO_TOPLEVEL','FORM_SUBMIT','RELOAD','KEYWORD','KEYWORD_GENERATED'];
const CHROME_QUAL = [[0x00800000,'BLOCKED'],[0x01000000,'FORWARD_BACK'],[0x02000000,'FROM_ADDRESS_BAR'],[0x04000000,'HOME_PAGE'],[0x08000000,'FROM_API'],[0x10000000,'CHAIN_START'],[0x20000000,'CHAIN_END'],[0x40000000,'CLIENT_REDIRECT'],[0x80000000,'SERVER_REDIRECT']];
function chromeTransition(v) {
  if (v == null) return null;
  v = Number(v) >>> 0;
  const core = CHROME_CORE[v & 0xff] || ('CORE_' + (v & 0xff));
  const q = CHROME_QUAL.filter(([b]) => (v & b) !== 0).map(x => x[1]);
  return q.length ? `${core} · ${q.join(', ')}` : core;
}
const FF_VISIT = {1:'LINK',2:'TYPED',3:'BOOKMARK',4:'EMBED',5:'REDIRECT_PERMANENT',6:'REDIRECT_TEMPORARY',7:'DOWNLOAD',8:'FRAMED_LINK',9:'RELOAD'};
const CH_DL_STATE = {0:'In progress',1:'Complete',2:'Cancelled',3:'Interrupted',4:'Interrupted'};
const CH_DANGER = {0:'Not dangerous',1:'Dangerous file',2:'Dangerous URL',3:'Dangerous content',4:'Maybe dangerous',5:'Uncommon content',6:'User validated',7:'Dangerous host',8:'Potentially unwanted',9:'Allowlisted by policy',10:'Async scanning',11:'Blocked: password protected',12:'Blocked: too large',13:'Sensitive content warning',14:'Sensitive content block',15:'Deep scanned: safe',16:'Deep scanned: opened dangerous',17:'Prompt for scanning',18:'Blocked: unsupported type',19:'Dangerous account compromise'};

function postValue(type, v) {
  switch (type) {
    case 'tr': return chromeTransition(v);
    case 'fv': return v == null ? null : (FF_VISIT[v] || `TYPE_${v}`);
    case 'ds': return v == null ? null : (CH_DL_STATE[v] ?? `State ${v}`);
    case 'dg': return v == null ? null : (CH_DANGER[v] ?? `Danger ${v}`);
    case 'b':  return v == null ? null : (v ? 'Yes' : 'No');
    case 'a': { const f = guessFmt(v); return f ? f.to(v) : null; }
    default:   return v;
  }
}
const typeOut = t => (t === 'a' ? 't' : (t === 'ds' || t === 'dg') ? '' : t);

/* ---------- artifact definitions ---------- */
// Column aliases carry a display type after "|": t=time(ms) u=url n=number b=bool tr=chrome transition fv=firefox visit type a=auto-detect timestamp
// tl = mapping into the combined timeline: column indexes for time,url,title,type
const SPECS = [
  // ===== Chromium (Chrome / Edge / Brave / Opera / Vivaldi) =====
  { b:'Chromium', need:['urls','visits'], name:'Visits', tl:{t:0,u:1,ti:2,ty:3},
    sql: h => `SELECT ${sel([
      `${WK('v.visit_time')} AS "Visit Time|t"`, `u.url AS "URL|u"`, `u.title AS "Title"`, `v.transition AS "Transition|tr"`,
      h('visits','visit_duration') && `ROUND(v.visit_duration / 1000000.0, 3) AS "Duration (s)|n"`,
      `u.visit_count AS "URL Visits|n"`, `u.typed_count AS "Typed Count|n"`, `v.id AS "Visit ID|n"`,
      h('visits','from_visit') && `v.from_visit AS "From Visit|n"`,
      h('visits','opener_visit') && `v.opener_visit AS "Opener Visit|n"`,
      h('visits','originator_cache_guid') && `v.originator_cache_guid AS "Synced From (GUID)"`,
    ])} FROM visits v LEFT JOIN urls u ON u.id = v.url ORDER BY v.visit_time` },
  { b:'Chromium', need:['urls'], name:'URLs',
    sql: h => `SELECT ${sel([
      `${WK('last_visit_time')} AS "Last Visit|t"`, `url AS "URL|u"`, `title AS "Title"`, `visit_count AS "Visits|n"`, `typed_count AS "Typed Count|n"`,
      h('urls','hidden') && `hidden AS "Hidden|b"`, `id AS "URL ID|n"`,
    ])} FROM urls ORDER BY last_visit_time` },
  { b:'Chromium', need:['downloads'], name:'Downloads',
    sql: h => `SELECT ${sel([
      `${WK('d.start_time')} AS "Start|t"`, h('downloads','end_time') && `${WK('d.end_time')} AS "End|t"`,
      h('downloads_url_chains') && `(SELECT c.url FROM downloads_url_chains c WHERE c.id = d.id ORDER BY c.chain_index DESC LIMIT 1) AS "Final URL|u"`,
      h('downloads','target_path') && `d.target_path AS "Target Path"`,
      h('downloads','received_bytes') && `d.received_bytes AS "Received (bytes)|n"`, h('downloads','total_bytes') && `d.total_bytes AS "Total (bytes)|n"`,
      `d.state AS "State|ds"`, h('downloads','danger_type') && `d.danger_type AS "Danger|dg"`,
      h('downloads','opened') && `d.opened AS "Opened|b"`, h('downloads','last_access_time') && `${WK('d.last_access_time')} AS "Last Opened|t"`,
      h('downloads','referrer') && `d.referrer AS "Referrer|u"`, h('downloads','tab_url') && `d.tab_url AS "Tab URL|u"`,
      h('downloads','mime_type') && `d.mime_type AS "MIME"`,
      h('downloads_url_chains') && `(SELECT group_concat(url, '  →  ') FROM (SELECT c.url FROM downloads_url_chains c WHERE c.id = d.id ORDER BY c.chain_index)) AS "Redirect Chain"`,
      `d.id AS "ID|n"`,
    ])} FROM downloads d ORDER BY d.start_time` },
  { b:'Chromium', need:['keyword_search_terms','urls'], name:'Search Terms',
    sql: () => `SELECT ${WK('u.last_visit_time')} AS "Last Visit|t", k.term AS "Search Term", u.url AS "URL|u", u.title AS "Title", u.visit_count AS "Visits|n"
      FROM keyword_search_terms k LEFT JOIN urls u ON u.id = k.url_id ORDER BY u.last_visit_time` },
  { b:'Chromium', need:['segments','segment_usage'], name:'Segments (Most Visited)',
    sql: () => `SELECT ${WK('su.time_slot')} AS "Time Slot|t", s.name AS "Segment", su.visit_count AS "Visits|n", u.url AS "URL|u"
      FROM segment_usage su JOIN segments s ON s.id = su.segment_id LEFT JOIN urls u ON u.id = s.url_id ORDER BY su.time_slot` },
  { b:'Chromium', need:['omni_box_shortcuts'], name:'Omnibox Shortcuts',
    sql: h => `SELECT ${sel([`${WK('last_access_time')} AS "Last Access|t"`, `text AS "Typed Text"`, `fill_into_edit AS "Completed To"`, `url AS "URL|u"`, `contents AS "Contents"`, h('omni_box_shortcuts','description') && `description AS "Description"`, `number_of_hits AS "Hits|n"`])}
      FROM omni_box_shortcuts ORDER BY last_access_time` },
  { b:'Chromium', need:['cookies'], when: h => h('cookies','host_key'), name:'Cookies',
    sql: h => `SELECT ${sel([

/* ---------- WAL merge (forensic: applies committed, checksum-valid frames only) ---------- */
function walChecksum(u8, off, len, littleEndian, s0, s1) {
  const dv = new DataView(u8.buffer, u8.byteOffset + off, len);
  for (let i = 0; i < len; i += 8) {
    s0 = (s0 + dv.getUint32(i, littleEndian) + s1) >>> 0;
    s1 = (s1 + dv.getUint32(i + 4, littleEndian) + s0) >>> 0;
  }
  return [s0, s1];
}
function applyWal(db, wal) {
  const info = { frames: 0, committedFrames: 0, commits: 0, pages: 0, uncommittedFrames: 0, stop: '' };
  if (wal.length < 32) { info.stop = 'WAL file is empty'; return { buf: db, info }; }
  const w = new DataView(wal.buffer, wal.byteOffset, wal.byteLength);
  const magic = w.getUint32(0);
  if (magic !== 0x377f0682 && magic !== 0x377f0683) throw new Error('Not a SQLite WAL file (bad magic)');
  const le = magic === 0x377f0682;
  const pageSize = w.getUint32(8), salt1 = w.getUint32(16), salt2 = w.getUint32(20);
  let [s0, s1] = walChecksum(wal, 0, 24, le, 0, 0);
  if (s0 !== w.getUint32(24) || s1 !== w.getUint32(28)) { info.stop = 'WAL header checksum mismatch — WAL not applied'; return { buf: db, info }; }
  const pending = new Map(), committed = new Map();
  let dbPages = 0, off = 32;
  while (off + 24 + pageSize <= wal.length) {
    const pg = w.getUint32(off), commit = w.getUint32(off + 4);
    if (w.getUint32(off + 8) !== salt1 || w.getUint32(off + 12) !== salt2) { info.stop = 'salt mismatch (older WAL generation follows)'; break; }
    [s0, s1] = walChecksum(wal, off, 8, le, s0, s1);
    [s0, s1] = walChecksum(wal, off + 24, pageSize, le, s0, s1);
    if (s0 !== w.getUint32(off + 16) || s1 !== w.getUint32(off + 20)) { info.stop = 'frame checksum mismatch'; break; }
    pending.set(pg, off + 24); info.frames++;
    if (commit) { for (const [k, v] of pending) committed.set(k, v); info.committedFrames += pending.size; pending.clear(); dbPages = commit; info.commits++; }
    off += 24 + pageSize;
  }
  info.uncommittedFrames = pending.size;
  if (!info.commits) { info.stop = info.stop || 'no committed transactions in WAL'; return { buf: db, info }; }
  const out = new Uint8Array(dbPages * pageSize);
  out.set(db.subarray(0, Math.min(db.length, out.length)));
  for (const [pg, o] of committed) if (pg <= dbPages) out.set(wal.subarray(o, o + pageSize), (pg - 1) * pageSize);
  info.pages = committed.size;
  return { buf: out, info };
}

/* ---------- loading ---------- */

async function handleFiles(list) {

      else if (/-(shm|journal)$/i.test(f.name)) continue;

    let first = null;
    for (const f of mains) {
      const buf = new Uint8Array(await f.arrayBuffer());
      if (!isSqlite(buf)) { toast(`${f.name} is not a SQLite database — skipped`, true); continue; }
      const wf = wals.get(f.name); wals.delete(f.name);
      const wal = wf ? new Uint8Array(await wf.arrayBuffer()) : null;
      const src = await addSource(f.name, buf, wal, wf && wf.name);
      if (src && !first) first = src;
    }
    for (const [base] of wals) toast(`Got ${base}-wal without ${base} — drop both together`, true);
    afterLoad(first);
  } catch (e) { console.error(e); toast('Error: ' + e.message, true); }
  finally { showLoading(false); }
}

async function addSource(name, original, wal, walName, opts = {}) {

  const f = { id, name: opts.label || name, origName: name, size: original.length, hash, walName, walHash, walSize: wal ? wal.length : 0, walInfo, walMode, notes, db, schema,
              browser: 'SQLite', reports: [], tables: [], sqlText: '', sqlReport: null, sqlErr: '', sample: !!opts.sample };

  for (const spec of SPECS) {
    if (!spec.need.every(t => h(t))) continue;

    if (f.browser === 'SQLite') f.browser = spec.b;
    if (spec.b !== f.browser) continue;

    return { name: t, count: n };

  const v = S.view, on = id => v && v.report && v.report.id === id && !v.sql ? ' on' : '';
  const item = (r, cls = '') => `<div class="it${cls}${on(r.id)}" data-r="${r.id}"><span class="nm">${esc(r.name)}</span><span class="cnt">${r.rows.length.toLocaleString()}</span></div>`;
  let h = '';
  if (!S.files.length) { h = `<div class="grp">Sources</div><div class="it tool" style="cursor:default"><span class="nm">No files loaded yet</span></div>`; $('#side').innerHTML = h; return; }
  if (S.combined.length) { h += `<div class="grp">All sources</div>` + S.combined.map(r => item(r)).join(''); }
  h += `<div class="grp">Sources</div>`;
  for (const f of S.files) {
    h += `<div class="src"><div class="srchead"><span class="badge b-${f.browser.toLowerCase()}">${esc(f.browser)}</span><span class="fname" title="${esc(f.origName)}">${esc(f.name)}</span><button class="x" data-rm="${f.id}" title="Close">×</button></div>`;
    h += f.reports.map(r => item(r)).join('');
    h += `<details${f.openTables ? ' open' : ''} data-tbls="${f.id}"><summary class="it tool"><span class="nm"><span class="car">▸</span> Raw tables</span><span class="cnt">${f.tables.length}</span></summary>`;
    for (const t of f.tables) {
      const key = `${f.id}:${t.name}`, act = v && v.report && v.report.tableKey === key ? ' on' : '';
      h += `<div class="it sub${act}" data-tbl="${f.id}" data-t="${esc(t.name)}"><span class="nm">${esc(t.name)}</span><span class="cnt">${t.count == null ? '?' : t.count.toLocaleString()}</span></div>`;
    }
    h += `</details>`;
    h += item(f.info, ' tool');
    h += `<div class="it tool${v && v.sql && v.fileId === f.id ? ' on' : ''}" data-sql="${f.id}"><span class="nm">SQL console</span><span class="cnt">›_</span></div></div>`;
  }
  $('#side').innerHTML = h;
}

/* ---------- views ---------- */
function openReport(r, extra = {}) {
  S.view = Object.assign({ report: r, idx: null, sort: null, sel: -1, filter: '', from: null, to: null, fileId: r ? r.fileId : null, widths: null }, extra);
  applyFilter();
  renderMain(); renderSide();
}
function openSql(f) {
  S.view = { sql: true, fileId: f.id, report: f.sqlReport, idx: null, sort: null, sel: -1, filter: '', from: null, to: null };
  if (f.sqlReport) applyFilter();
  renderMain(); renderSide();
  const ta = $('#sqlta'); if (ta) ta.focus();
}
function afterLoad(first) {
  buildCombined();
  if (first) {
    const tl = S.combined[0];
    openReport(tl && S.files.length > 1 ? tl : (first.reports[0] || first.info));
  } else { renderSide(); if (!S.view) renderMain(); }
}

const fileById = id => S.files.find(f => f.id === id);
function renderMain() {
  const m = $('#main'), v = S.view;
  if (!S.files.length || !v) { m.innerHTML = emptyHtml(); return; }
  const r = v.report, f = fileById(v.fileId);
  const crumb = v.sql ? esc(f.name) : (r ? esc(r.src) : '');
  const title = v.sql ? 'SQL console' : esc(r.name);
  const hasT = r && r.cols.some(c => c.type === 't');
  let h = `<div class="bar"><div class="ttl"><span class="crumb">${crumb} /</span><b>${title}</b><span class="count" id="count"></span></div>`;
  if (r) {
    h += `<input class="in" id="q" placeholder="Filter rows…  (all columns)" value="${esc(v.filter)}" autocomplete="off" spellcheck="false">`;
    if (hasT) h += `<div class="rng">From <input class="in" type="datetime-local" step="1" id="from"> to <input class="in" type="datetime-local" step="1" id="to"><span id="tzlbl">${S.tz === 'utc' ? 'UTC' : 'local'}</span></div>`;
    if (suiteOk() && hasT) h += `<button class="btn small" id="toRecap" title="Open these rows as a timeline in Recap">Send to Recap</button><button class="btn small" id="toTessera" title="Add these rows to the case notebook as key events">Send to Tessera</button>`;
    h += `<button class="btn small" id="copy" title="Copy the filtered rows as CSV">Copy CSV</button><button class="btn small" id="dl" title="Download the filtered rows as CSV">Download CSV</button>`;
  }
  h += `</div>`;
  if (v.sql) {
    const pre = [...(PRESETS[f.browser] || []), ...COMMON_PRESETS];
    h += `<div class="console"><textarea id="sqlta" spellcheck="false">${esc(f.sqlText)}</textarea>
      <div class="side"><button class="btn primary" id="run">Run ⌘/Ctrl+Enter</button>
      <label class="chk"><input type="checkbox" id="autodec" ${f.autoDec !== false ? 'checked' : ''}> Auto-decode timestamps</label>
      <span class="hint">Runs on an in-memory copy.</span></div>
      <div class="presets">${pre.map((p, i) => `<button class="btn small" data-preset="${i}">${esc(p[0])}</button>`).join('')}</div>
      ${f.sqlErr ? `<div class="err">${esc(f.sqlErr)}</div>` : ''}</div>`;
  }
  h += `<div class="body"><div id="gridwrap">${r ? gridShell(r) : `<div class="nodata">Write a query and press Run.</div>`}</div><div id="detail" hidden></div></div>`;
  m.innerHTML = h;
  if (r) { renderRows(); updateCount(); $('#gridwrap').addEventListener('scroll', () => requestAnimationFrame(renderRows)); }
  if (v.sel >= 0 && r) showDetail(v.sel);
}

function emptyHtml() {
  return `<div class="empty"><div class="drop">
    <h1>Drop browser artifacts here</h1>
    <p>Schema parses SQLite databases right in your browser using SQLite compiled to WebAssembly. Known browser artifacts are decoded automatically: timestamps, visit transitions and download states. Anything else gets a table browser and a SQL console.</p>
    <div class="acts"><label class="btn primary">Choose files…<input type="file" id="fi2" multiple hidden></label><button class="btn" id="sample">Try with sample data</button></div>
    <div class="sup">
      <div><b><span class="badge b-chromium">Chromium</span></b><code>History<br>Cookies · Login Data<br>Web Data · Shortcuts</code></div>
      <div><b><span class="badge b-firefox">Firefox</span></b><code>places.sqlite<br>cookies.sqlite<br>formhistory.sqlite</code></div>
      <div><b><span class="badge b-safari">Safari</span></b><code>History.db<br><br>+ any other SQLite file</code></div>
    </div>
    <div class="tips">
      Chrome, Edge, Brave, Opera and Vivaldi all share the Chromium format. Drop several files at once to get a combined, cross-browser timeline.<br>
      Copy the <code>-wal</code> file alongside the database (e.g. <code>History</code> + <code>History-wal</code>). Schema merges committed, checksum-valid WAL frames into an in-memory copy.<br>
      Browsers lock these files while running. Work from a copy or a forensic image, not the live profile.
    </div>
    <p class="tips" style="margin-top:14px">&copy; 2026 <a href="https://jon.glass/" style="color:inherit">Jon Glass</a> &middot; <a href="https://github.com/glassdfir/schema/blob/main/LICENSE" style="color:inherit">MIT License</a> &middot; <a href="https://github.com/glassdfir/schema" style="color:inherit">Source</a> &middot; SQLite engine: <a href="https://github.com/sql-js/sql.js" style="color:inherit">sql.js</a> (MIT)</p></div></div>`;
}

/* ---------- grid ---------- */
const RH = 27;
const DEFW = { t: 196, u: 380, n: 100, b: 80, tr: 250, fv: 160 };
function colWidth(c) {
  if (c.w) return c.w;
  if (DEFW[c.type]) return DEFW[c.type];
  if (/title|path|destination|chain|value|metadata|sql/i.test(c.label)) return 300;
  return Math.min(260, Math.max(110, c.label.length * 9 + 30));
}
function gridShell(r) {
  const v = S.view, total = r.cols.reduce((s, c) => s + colWidth(c), 0);
  const ths = r.cols.map((c, i) => {
    const ar = v.sort && v.sort.col === i ? `<span class="ar">${v.sort.dir > 0 ? '▲' : '▼'}</span>` : '';
    const lbl = c.type === 't' ? `${c.label} (${S.tz === 'utc' ? 'UTC' : 'local'})` : c.label;
    return `<th data-c="${i}" title="${esc(lbl)}" style="position:sticky">${esc(lbl)}${ar}<span class="rz" data-rz="${i}"></span></th>`;
  }).join('');
  return `<table id="grid" style="width:${total}px"><colgroup>${r.cols.map((c, i) => `<col data-col="${i}" style="width:${colWidth(c)}px">`).join('')}</colgroup><thead><tr>${ths}</tr></thead><tbody></tbody></table>`;
}
function cellHtml(c, v) {
  if (v == null) return `<td class="null ty-${c.type}"></td>`;
  if (v instanceof Uint8Array) return `<td class="null">‹blob ${v.length.toLocaleString()} B›</td>`;
  const s = c.type === 't' ? fmtT(v) : String(v);
  return `<td class="ty-${c.type}">${esc(s.length > 600 ? s.slice(0, 600) + '…' : s)}</td>`;
}
function renderRows() {
  const v = S.view; if (!v || !v.report) return;
  const wrap = $('#gridwrap'), tb = wrap && wrap.querySelector('tbody'); if (!tb) return;
  const r = v.report, idx = v.idx, n = idx.length, nc = r.cols.length;
  const st = wrap.scrollTop, hh = wrap.clientHeight;
  const a = Math.max(0, Math.floor(st / RH) - 15), b = Math.min(n, Math.ceil((st + hh) / RH) + 15);
  let h = `<tr style="height:${a * RH}px"><td colspan="${nc}" style="padding:0;border:0;height:${a * RH}px"></td></tr>`;
  for (let k = a; k < b; k++) {
    const i = idx[k], row = r.rows[i];
    h += `<tr class="r${i === v.sel ? ' on' : ''}" data-i="${i}">`;
    for (let c = 0; c < nc; c++) h += cellHtml(r.cols[c], row[c]);
    h += `</tr>`;
  }
  const rest = (n - b) * RH;
  h += `<tr style="height:${rest}px"><td colspan="${nc}" style="padding:0;border:0;height:${rest}px"></td></tr>`;
  if (!n) h = `<tr><td colspan="${nc}" style="color:var(--muted);padding:20px">No rows${v.filter || v.from != null || v.to != null ? ' match the filter' : ''}.</td></tr>`;
  tb.innerHTML = h;
}
function updateCount() {
  const v = S.view, el = $('#count'); if (!el || !v.report) return;
  const t = v.report.rows.length, n = v.idx.length;
  el.textContent = n === t ? `${t.toLocaleString()} rows` : `${n.toLocaleString()} of ${t.toLocaleString()} rows`;
}
function searchIndex(r) {
  if (r._s && r._stz === S.tz) return r._s;
  r._s = r.rows.map(row => row.map((x, i) => x == null ? '' : x instanceof Uint8Array ? '' : r.cols[i].type === 't' ? fmtT(x) : String(x)).join('\u0001').toLowerCase());
  r._stz = S.tz;
  return r._s;
}
function applyFilter() {
  const v = S.view, r = v.report; if (!r) return;
  const q = (v.filter || '').toLowerCase().trim();
  const tc = r.cols.findIndex(c => c.type === 't');
  const s = q ? searchIndex(r) : null, terms = q ? q.split(/\s+/) : [];
  const idx = [];
  for (let i = 0; i < r.rows.length; i++) {
    if (s && !terms.every(t => s[i].includes(t))) continue;
    if (tc >= 0 && (v.from != null || v.to != null)) {
      const t = r.rows[i][tc];
      if (t == null || (v.from != null && t < v.from) || (v.to != null && t > v.to)) continue;
    }
    idx.push(i);
  }
  if (v.sort) {
    const { col, dir } = v.sort, rows = r.rows;
    idx.sort((a, b) => {
      let x = rows[a][col], y = rows[b][col];
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
      x = String(x); y = String(y); return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
  }
  v.idx = idx;
}
function refreshGrid() { applyFilter(); renderRows(); updateCount(); }

/* ---------- detail ---------- */
function hexdump(u8, max = 512) {
  let out = '';
  for (let o = 0; o < Math.min(u8.length, max); o += 16) {
    const s = [...u8.subarray(o, Math.min(o + 16, u8.length))];
    out += o.toString(16).padStart(6, '0') + '  ' + s.map(b => b.toString(16).padStart(2, '0')).join(' ').padEnd(48) + '  ' + s.map(b => b > 31 && b < 127 ? String.fromCharCode(b) : '.').join('') + '\n';
  }
  if (u8.length > max) out += `… ${(u8.length - max).toLocaleString()} more bytes`;
  return out;
}
function showDetail(i) {
  const v = S.view, r = v.report, row = r.rows[i], d = $('#detail'); if (!d || !row) return;
  v.sel = i;
  let h = `<h3><span>Row details</span><button class="btn small" id="cpyrow">Copy JSON</button><button class="x" id="closed" title="Close">×</button></h3>`;
  r.cols.forEach((c, k) => {
    const x = row[k]; let val;
    if (x == null) val = `<span class="muted">NULL</span>`;
    else if (x instanceof Uint8Array) val = `<span class="muted">BLOB · ${x.length.toLocaleString()} bytes</span><pre class="hex">${esc(hexdump(x))}</pre>`;
    else if (c.type === 't') val = `${esc(fmtT(x, 'utc'))} UTC<br><span class="muted">${esc(fmtT(x, 'local'))} local · ${esc(String(Math.round(x)))} unix ms</span>`;
    else val = esc(String(x));
    h += `<div class="kv"><div class="k">${esc(c.label)}</div><div class="v ty-${c.type}">${val}</div></div>`;
  });
  d.innerHTML = h; d.hidden = false;
  document.querySelectorAll('#grid tr.r.on').forEach(e => e.classList.remove('on'));
  const tr = document.querySelector(`#grid tr.r[data-i="${i}"]`); if (tr) tr.classList.add('on');
}
function rowJson(i) {
  const r = S.view.report, row = r.rows[i], o = {};
  r.cols.forEach((c, k) => { const x = row[k]; o[c.label] = x instanceof Uint8Array ? `<blob ${x.length} bytes>` : c.type === 't' && x != null ? fmtT(x, 'utc') + 'Z' : x; });
  return JSON.stringify(o, null, 2);
}

/* ---------- CSV ---------- */
function csvCell(x, c) {
  if (x == null) return '';
  let s = x instanceof Uint8Array ? `<blob ${x.length} bytes>` : c.type === 't' ? fmtT(x) : String(x);
  if (/^[=+@\t\r]/.test(s) || (/^-/.test(s) && c.type !== 'n')) s = "'" + s;   // neutralise spreadsheet formula injection from evidence
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv() {
  const v = S.view, r = v.report;
  const head = r.cols.map(c => csvCell(c.type === 't' ? `${c.label} (${S.tz === 'utc' ? 'UTC' : 'local'})` : c.label, {})).join(',');
  const lines = [head];
  for (const i of v.idx) lines.push(r.cols.map((c, k) => csvCell(r.rows[i][k], c)).join(','));
  return lines.join('\r\n');
}
const csvName = () => { const r = S.view.report; return `${(r.src + '_' + r.name).replace(/[^\w.-]+/g, '_').replace(/_+/g, '_')}.csv`; };
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
  }
}

// Hosted as a claude.ai artifact: saves go through the viewer's download capability. Opened as a local file: a normal download link.
let hostDownloads;
const hostDl = () => hostDownloads ??= (window.claude && typeof window.claude.use === 'function'
  ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null));
async function downloadCsv() {
  const csv = toCsv(), name = csvName();
  const dl = await hostDl();
  if (dl) {
    try { await dl.save({ filename: name, data: csv }); toast(`Saved ${name}`); }
    catch (e) { if (e && e.code === 'declined') return; toast('Download unavailable here — use Copy CSV', true); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- suite hand-offs (jon.glass only; see /assets/suite/handoff.js) ---------- */
const suiteOk = () => !!(window.Suite && Suite.available());
const isoZ = ms => { const d = new Date(ms); return isNaN(d.getTime()) ? '' : d.toISOString(); };
function suiteCsv(cols, rows) {
  const cell = s => { s = String(s ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.map(cell).join(','), ...rows.map(r => r.map(cell).join(','))].join('\n') + '\n';
}
const slugName = () => { const r = S.view.report; return `${r.src}_${r.name}`.replace(/[^\w.-]+/g, '_').replace(/_+/g, '_'); };
async function sendToRecap() {
  const v = S.view, r = v.report;
  const rows = v.idx.map(i => r.rows[i].map((x, k) => x == null ? '' : x instanceof Uint8Array ? `<blob ${x.length} bytes>` : r.cols[k].type === 't' ? isoZ(x) : String(x)));
  const tcols = r.cols.filter(c => c.type === 't').map(c => c.label);
  try { location.href = await Suite.send('schema', 'recap', { kind: 'table', name: slugName(), data: suiteCsv(r.cols.map(c => c.label), rows), meta: { timeCols: tcols.slice(0, 1), tz: 0 } }); }
  catch (e) { toast(e.message, true); }
}
async function sendToTessera() {
  const v = S.view, r = v.report;
  const tc = r.cols.findIndex(c => c.type === 't');
  const ui = r.cols.findIndex(c => c.type === 'u');
  const ti = r.cols.findIndex(c => /^(title|search term|typed text|target path|destination|value)$/i.test(c.label));
  if (v.idx.length > 500 && !confirmBar(`Send ${v.idx.length.toLocaleString()} rows to Tessera as key events? Filter first to keep the case readable.`)) return;
  const rows = v.idx.map(i => {
    const row = r.rows[i], parts = [];
    if (ti >= 0 && row[ti] != null && row[ti] !== '') parts.push(String(row[ti]));
    if (ui >= 0 && row[ui]) parts.push(String(row[ui]));
    if (!parts.length) parts.push(row.filter((x, k) => k !== tc && x != null && !(x instanceof Uint8Array)).slice(0, 3).join(' · '));
    return [isoZ(row[tc]), `${r.name}: ${parts.join(' — ')}`, `${r.src} (Schema)`];
  }).filter(x => x[0]);
  try { location.href = await Suite.send('schema', 'tessera', { kind: 'events', name: slugName(), data: suiteCsv(['timestamp', 'event', 'source'], rows) }); }
  catch (e) { toast(e.message, true); }
}
let confirmArmed = 0;
function confirmBar(msg) { if (Date.now() - confirmArmed < 6000) { confirmArmed = 0; return true; } confirmArmed = Date.now(); toast(msg + ' Click again to send.'); return false; }
async function bootParams() {
  let params; try { params = new URLSearchParams(location.search); } catch { return; }
  if (params.get('sample')) loadSample();
  const from = params.get('from');
  if (from && window.Suite) {
    try {
      const h = await Suite.receive('schema', from);
      if (h) await handleBytes(h.name, h.bytes, ` (from ${h.fromName})`);
    } catch (e) { toast('Could not load the hand-off: ' + e.message, true); }
    try { history.replaceState(null, '', location.pathname); } catch {}
  }
}
async function handleBytes(name, bytes, suffix = '') {
  showLoading(true);
  try {
    await sqlReady;
    if (!isSqlite(bytes)) { toast(`${name} is not a SQLite database`, true); return; }
    const src = await addSource(name, bytes, null, null, { label: name + suffix });
    afterLoad(src);
  } finally { showLoading(false); }
}

/* ---------- UI plumbing ---------- */
let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 5200 : 2600); }
function showLoading(on) { $('#loading').classList.toggle('show', on); }
const parseLocalInput = v => !v ? null : (S.tz === 'utc' ? Date.parse(v + 'Z') : Date.parse(v));

document.addEventListener('change', e => {
  if (e.target.id === 'fi' || e.target.id === 'fi2') { handleFiles(e.target.files); e.target.value = ''; }
  if (e.target.id === 'from' || e.target.id === 'to') { S.view[e.target.id] = parseLocalInput(e.target.value); refreshGrid(); }
  if (e.target.id === 'autodec') { const f = fileById(S.view.fileId); f.autoDec = e.target.checked; }
});
let qT;
document.addEventListener('input', e => {
  if (e.target.id === 'q') { clearTimeout(qT); const val = e.target.value; qT = setTimeout(() => { S.view.filter = val; refreshGrid(); $('#gridwrap').scrollTop = 0; }, 140); }
  if (e.target.id === 'sqlta') { const f = fileById(S.view.fileId); f.sqlText = e.target.value; }
});
document.addEventListener('click', async e => {
  const t = e.target;
  const tz = t.closest('[data-tz]');
  if (tz) {
    S.tz = tz.dataset.tz; document.querySelectorAll('#tz button').forEach(b => b.classList.toggle('on', b.dataset.tz === S.tz));
    if (S.view) { S.view.from = S.view.to = null; if (S.view.report) { const sc = $('#gridwrap')?.scrollTop || 0; renderMain(); applyFilter(); renderRows(); updateCount(); if ($('#gridwrap')) $('#gridwrap').scrollTop = sc; } }
    return;
  }
  if (t.id === 'sample') { loadSample(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { removeFile(rm.dataset.rm); return; }
  const it = t.closest('[data-r]');
  if (it) { openReport(S.reports.get(it.dataset.r)); return; }
  const tb = t.closest('[data-tbl]');
  if (tb) { const f = fileById(tb.dataset.tbl); f.openTables = true; showLoading(true); setTimeout(() => { try { openReport(tableReport(f, tb.dataset.t)); } catch (err) { toast(err.message, true); } finally { showLoading(false); } }, 10); return; }
  const sq = t.closest('[data-sql]');
  if (sq) { openSql(fileById(sq.dataset.sql)); return; }
  if (t.id === 'run') { runConsole(); return; }
  const pr = t.closest('[data-preset]');
  if (pr) { const f = fileById(S.view.fileId); const list = [...(PRESETS[f.browser] || []), ...COMMON_PRESETS]; f.sqlText = list[+pr.dataset.preset][1]; $('#sqlta').value = f.sqlText; runConsole(); return; }
  if (t.classList.contains('rz')) return;
  const th = t.closest('#grid th');
  if (th) {
    const c = +th.dataset.c, v = S.view;
    v.sort = !v.sort || v.sort.col !== c ? { col: c, dir: 1 } : v.sort.dir === 1 ? { col: c, dir: -1 } : null;
    applyFilter();
    const wrap = $('#gridwrap'); wrap.innerHTML = gridShell(v.report); renderRows(); updateCount();
    return;
  }
  const tr = t.closest('#grid tr.r');

function runConsole() {
  const v = S.view, f = fileById(v.fileId);
  f.sqlText = $('#sqlta').value; f.sqlErr = '';
  try {
    let last = null;
    for (const stmt of f.db.iterateStatements(f.sqlText)) {
      const names = stmt.getColumnNames(), rows = [];
      while (stmt.step()) rows.push(stmt.get());
      if (names.length) last = { cols: names.map(n => ({ label: n, type: '' })), rows };
    }
    if (!last) { f.sqlErr = 'Statement ran — no result set returned.'; f.sqlReport = null; }
    else {
      const d = f.autoDec !== false ? autoDecode(last.cols, last.rows) : last;
      if (f.sqlReport) S.reports.delete(f.sqlReport.id);
      f.sqlReport = mkReport('Query result', d.cols, d.rows, f);
    }
  } catch (err) { f.sqlErr = err.message; }
  S.view = { sql: true, fileId: f.id, report: f.sqlReport, idx: null, sort: null, sel: -1, filter: '', from: null, to: null };
  if (f.sqlReport) applyFilter();
  renderMain();
}
function removeFile(id) {
  const f = fileById(id); if (!f) return;
  try { f.db.close(); } catch {}
  for (const [k, r] of S.reports) if (r.fileId === id) S.reports.delete(k);
  S.files = S.files.filter(x => x !== f);
  buildCombined();
  if (!S.view || S.view.fileId === id || (S.view.report && !S.reports.has(S.view.report.id))) {
    const nf = S.files[0];
    S.view = null;
    if (nf) openReport(S.combined[0] && S.files.length > 1 ? S.combined[0] : (nf.reports[0] || nf.info));
  }
  renderSide(); if (!S.view) renderMain();
}
